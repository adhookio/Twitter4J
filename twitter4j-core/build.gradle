plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.github.adhookio' // Replace with your GitHub username
version = '4.0.7'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.json:json:20220320'
    implementation 'org.apache.httpcomponents:httpclient:4.5.13'
    implementation 'commons-logging:commons-logging:1.2'
    testImplementation 'junit:junit:4.13.2'
}

// ✅ Disable signing to prevent JitPack failure
tasks.withType(Sign).configureEach {
    enabled = false
}

// Publishing configuration
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = 'twitter4j-core'
            version = project.version

            pom {
                name = 'Twitter4J Core'
                description = 'A Java library for the Twitter API'
                url = 'https://github.com/adhookio/twitter4j' // Adjust as needed

                licenses {
                    license {
                        name = 'Apache License 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }

                developers {
                    developer {
                        id = 'adhookio'
                        name = 'Adhook.io Team'
                        email = 'support@adhook.io'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/adhookio/twitter4j.git'
                    developerConnection = 'scm:git:ssh://github.com:adhookio/twitter4j.git'
                    url = 'https://github.com/adhookio/twitter4j'
                }
            }
        }
    }
}
